# AutoML Doctor configuration: every option with its default value.
# Precedence: defaults < this file (--config) < CLI flags.
# All thresholds are screening heuristics, not significance tests.

seed = 42
evaluation_target = "unspecified"        # unseen_rows | unseen_groups | unspecified
allow_extra_columns = false
exclude_columns = []
# time_column = "visit_date"            # metadata only in v0.1 (never a feature)
# fail_on = "high"                       # exit 1 if any finding is at least this severe
continue_on_error = false
load_plugins = false
# enabled_diagnostics = ["data_integrity", "leakage"]   # default: all

[integrity]
missing_warning_fraction = 0.05
missing_high_fraction = 0.3
near_constant_fraction = 0.99
mixed_type_min_fraction = 0.01

[imbalance]
min_minority_count = 20
min_minority_proportion = 0.05
severe_minority_count = 10
severe_minority_proportion = 0.02

[correlation]
threshold = 0.9
near_perfect_threshold = 0.99
min_pair_n = 10
max_features = 1000
top_n = 25

[outliers]
modified_z_threshold = 3.5
iqr_multiplier = 1.5
use_iqr_fallback = true
min_n = 5
top_n = 25

[leakage]
cross_split_high_fraction = 0.1
association_threshold = 0.98
auc_threshold = 0.99
purity_threshold = 0.99
min_n = 10
suspicious_name_patterns = ["target", "label", "outcome", "leak", "future", "y_?true", "ground_?truth", "diagnos", "result"]

[overfitting]
score_gap_medium = 0.05
score_gap_high = 0.15
r2_gap_medium = 0.1
r2_gap_high = 0.25
loss_relative_gap_medium = 0.25
loss_relative_gap_high = 0.5

[uncertainty]
n_bootstrap = 1000
confidence_level = 0.95
min_valid_fraction = 0.8
min_resampling_units = 30
bounded_width_threshold = 0.1
relative_width_threshold = 0.5

[prediction_errors]
bias_fraction_threshold = 0.25
prevalence_shift_threshold = 0.15
min_n = 5
top_confusions = 10
recall_ratio_threshold = 0.5
min_class_support = 10
