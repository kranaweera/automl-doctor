name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: mypy

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov=mldoctor --cov-report=term-missing
      - name: CLI smoke test
        shell: bash
        run: |
          mldoctor version
          mldoctor checks
          cd examples/grouped_data
          mldoctor diagnose --train train.csv --test test.csv \
            --predictions test_predictions.csv --train-predictions train_predictions.csv \
            --target gait_speed --row-id visit_id --group participant_id \
            --evaluation-target unseen_groups --task regression --output ci_report.json --quiet
          mldoctor report ci_report.json
